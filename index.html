<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA MESA V7</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --red: #ff4444; --green: #00c851; --admin: #00ff41; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; margin: 0; padding-top: 20px; }
        
        /* Controles Superiores */
        .controles-topo { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 8px; }
        .btn-topo { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; font-size: 12px; }

        .progress-wrapper { width: 90%; max-width: 400px; background: var(--red); height: 25px; border-radius: 15px; border: 2px solid #333; overflow: hidden; margin-top: 20px; }
        #progressBar { height: 100%; width: 0%; background: var(--green); transition: width 0.4s; }

        .grid-erros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 90%; max-width: 400px; margin: 15px 0; }
        .card-erro { background: white; padding: 5px; border-radius: 5px; text-align: center; font-size: 12px; border-bottom: 3px solid var(--red); }

        .voto-container { display: flex; gap: 20px; margin-top: 20px; }
        .voto-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; cursor: pointer; width: 120px; }
        .voto-card img { width: 60px; height: 60px; margin-bottom: 10px; pointer-events: none; }

        /* Modais */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 15px; z-index: 1000; box-shadow: 0 0 50px rgba(0,0,0,0.3); width: 300px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 900; }
        
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-confirmar { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; background: #007bff; margin-top: 10px; }
        
        .btn-alternativa { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; background: #f8f9fa; font-weight: bold; }
        .btn-alternativa:hover { background: #e9ecef; }

        #adminPanel { background: #111; color: var(--admin); border: 2px solid var(--admin); }
        #canvasBox { position: relative; width: 300px; height: 300px; border: 1px solid #000; margin: 10px auto; background: white; }
    </style>
</head>
<body>

    <div class="controles-topo">
        <button class="btn-topo" style="background:#28a745" onclick="abrirModal('modalDownload')">📊 BAIXAR EXCEL</button>
        <button class="btn-topo" style="background:#6c757d" onclick="verRegistros()">🔍 VER REGISTROS</button>
    </div>

    <h1>CONTROLE DE MISSÕES</h1>

    <div style="display:flex; gap:10px;">
        <button onclick="undo()" style="background:#ffc107; padding:8px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">↩️ DESFAZER</button>
        <button onclick="abrirModal('modalPlanejamento')" style="background:#17a2b8; color:white; padding:8px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">📝 PLANEJAMENTO</button>
    </div>

    <div class="progress-wrapper"><div id="progressBar"></div></div>
    <div style="margin-top:5px; font-weight:bold;">SUCESSO: <span id="percentual">0%</span></div>

    <div class="grid-erros">
        <div class="card-erro">Mesa: <b id="e-mesa">0</b></div>
        <div class="card-erro">Montagem: <b id="e-montagem">0</b></div>
        <div class="card-erro">Programação: <b id="e-programacao">0</b></div>
        <div class="card-erro">Variação: <b id="e-variacao">0</b></div>
        <div class="card-erro">Soltagem: <b id="e-soltagem">0</b></div>
    </div>

    <div class="voto-container">
        <div class="voto-card" onclick="iniciarFluxo(true)">
            <img src="like.png" alt="OK">
            <p>CORRETO</p>
        </div>
        <div class="voto-card" onclick="iniciarFluxo(false)">
            <img src="6323-dislikebs.png" alt="ERRO">
            <p>ERRADO</p>
        </div>
    </div>

    <div id="overlay" class="overlay" onclick="fecharTudo()"></div>

    <div id="modalEspec" class="modal">
        <h3>Especificações da Soltagem</h3>
        <label>Missão:</label>
        <select id="inputMissao"></select>
        <label>Duração (minutos):</label>
        <input type="number" id="inputTempo" placeholder="Ex: 12">
        <label>Data:</label>
        <input type="date" id="inputData">
        <div id="containerAcao"></div>
        <button onclick="fecharTudo()" style="width:100%; background:none; border:none; color:red; margin-top:10px; cursor:pointer;">Cancelar</button>
    </div>

    <div id="modalErro" class="modal">
        <div style="text-align:center;">
            <img src="duvida.png" style="width:50px;">
            <h3>Motivo do Erro</h3>
            <p>Tempo: <span id="tempoNoErro">0</span> min</p>
        </div>
        <div id="listaAlternativas">
            <button class="btn-alternativa" onclick="finalizar('Mesa')">Mesa</button>
            <button class="btn-alternativa" onclick="finalizar('Montagem')">Montagem</button>
            <button class="btn-alternativa" onclick="finalizar('Programação')">Programação</button>
            <button class="btn-alternativa" onclick="finalizar('Variação')">Variação</button>
            <button class="btn-alternativa" onclick="finalizar('Soltagem')">Soltagem</button>
        </div>
    </div>

    <div id="modalPlanejamento" class="modal" style="width:340px;">
        <h3>Planejamento</h3>
        <div id="canvasBox">
            <img src="mesa.png" style="width:300px; height:300px; position:absolute;">
            <canvas id="paintCanvas" width="300" height="300" style="position:absolute; cursor:crosshair;"></canvas>
        </div>
        <button class="btn-confirmar" onclick="limparPaint()" style="background:#6c757d;">Limpar</button>
        <button class="btn-confirmar" onclick="fecharTudo()">Fechar</button>
    </div>

    <div id="adminPanel" class="modal">
        <h3>PAINEL DE ADMIN</h3>
        <label>Título:</label>
        <input type="text" id="cfgTitulo" oninput="db.titulo=this.value; salvar()">
        <button class="btn-confirmar" style="background:red;" onclick="if(confirm('Zerar tudo?')){localStorage.clear(); location.reload();}">RESET TOTAL</button>
        <button onclick="fecharTudo()" style="color:white; background:none; border:none; width:100%; margin-top:15px; cursor:pointer;">Fechar</button>
    </div>

    <div id="modalDownload" class="modal">
        <h3>Baixar Relatório</h3>
        <input type="date" id="dataDownload">
        <button class="btn-confirmar" onclick="exportar()">BAIXAR XLSX</button>
        <button onclick="fecharTudo()" style="width:100%; border:none; background:none; color:red; margin-top:10px; cursor:pointer;">Fechar</button>
    </div>

    <audio id="audioOk" src="acerto.mp3"></audio>
    <audio id="audioErro" src="erro.mp3"></audio>

    <script>
        // BANCO DE DADOS
        let db = JSON.parse(localStorage.getItem('mesa_v7')) || {
            sim: 0, nao: 0, titulo: "MESA - CONTROLE DE MISSÕES",
            registros: [],
            erros: { Mesa:0, Montagem:0, Programação:0, Variação:0, Soltagem:0 }
        };

        let vTemporario = null;
        let buffer = "";

        // Popular Missões
        const sel = document.getElementById('inputMissao');
        for(let i=1; i<=15; i++) {
            let m = "M" + (i < 10 ? "0"+i : i);
            let opt = document.createElement('option'); opt.value = m; opt.text = m; sel.appendChild(opt);
        }

        function salvar() {
            localStorage.setItem('mesa_v7', JSON.stringify(db));
            atualizarTela();
        }

        function atualizarTela() {
            document.querySelector('h1').innerText = db.titulo;
            document.getElementById('e-mesa').innerText = db.erros.Mesa;
            document.getElementById('e-montagem').innerText = db.erros.Montagem;
            document.getElementById('e-programacao').innerText = db.erros.Programação;
            document.getElementById('e-variacao').innerText = db.erros.Variação;
            document.getElementById('e-soltagem').innerText = db.erros.Soltagem;
            
            let total = db.sim + db.nao;
            let p = total === 0 ? 0 : Math.round((db.sim / total) * 100);
            document.getElementById('progressBar').style.width = p + "%";
            document.getElementById('percentual').innerText = p + "%";
        }

        function abrirModal(id) {
            document.getElementById('overlay').style.display = 'block';
            document.getElementById(id).style.display = 'block';
        }

        function fecharTudo() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
            document.getElementById('overlay').style.display = 'none';
        }

        function iniciarFluxo(sucesso) {
            vTemporario = sucesso;
            document.getElementById('inputData').valueAsDate = new Date();
            const btnBox = document.getElementById('containerAcao');
            
            if(sucesso) {
                btnBox.innerHTML = '<button class="btn-confirmar" style="background:#28a745" onclick="finalizar(\'N/A\')">SALVAR SUCESSO</button>';
            } else {
                btnBox.innerHTML = '<button class="btn-confirmar" style="background:#fd7e14" onclick="irParaAlternativas()">DEFINIR MOTIVO DO ERRO</button>';
            }
            abrirModal('modalEspec');
        }

        function irParaAlternativas() {
            const tempo = document.getElementById('inputTempo').value;
            if(!tempo) { alert("Digite o tempo!"); return; }
            document.getElementById('tempoNoErro').innerText = tempo;
            fecharTudo();
            abrirModal('modalErro');
        }

        function finalizar(motivo) {
            const m = document.getElementById('inputMissao').value;
            const t = document.getElementById('inputTempo').value;
            const d = document.getElementById('inputData').value;

            if(!t || !d) { alert("Preencha tempo e data!"); return; }

            const novo = { data: d, missao: m, tempo: t + " min", resultado: vTemporario ? "SUCESSO" : "ERRO", motivo: motivo };
            db.registros.push(novo);

            if(vTemporario) {
                db.sim++;
                try { document.getElementById('audioOk').play(); } catch(e){}
                confetti({ particleCount: 100, spread: 70 });
            } else {
                db.nao++;
                db.erros[motivo]++;
                try { document.getElementById('audioErro').play(); } catch(e){}
            }

            fecharTudo();
            salvar();
        }

        function undo() {
            let u = db.registros.pop();
            if(!u) return;
            if(u.resultado === "SUCESSO") db.sim--; else { db.nao--; db.erros[u.motivo]--; }
            salvar();
        }

        function verRegistros() {
            if(db.registros.length === 0) { alert("Nenhum registro."); return; }
            let lista = db.registros.map(r => ${r.data} | ${r.missao} | ${r.resultado} | ${r.motivo}).join('\n');
            alert("ÚLTIMOS REGISTROS:\n" + lista);
        }

        // PAINT SYSTEM
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        canvas.onmousedown = () => painting = true;
        canvas.onmouseup = () => { painting = false; ctx.beginPath(); };
        canvas.onmousemove = (e) => {
            if(!painting) return;
            ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = 'red';
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke(); ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        };
        function limparPaint() { ctx.clearRect(0,0,300,300); }

        // GATILHO ADMIN
        document.addEventListener('keydown', (e) => {
            buffer += e.key.toLowerCase();
            if(buffer.endsWith("paineladm0102")) abrirModal('adminPanel');
            if(buffer.length > 20) buffer = buffer.substring(1);
        });

        function exportar() {
            const dt = document.getElementById('dataDownload').value;
            const f = db.registros.filter(r => r.data === dt);
            if(f.length === 0) { alert("Nada neste dia."); return; }
            const ws = XLSX.utils.json_to_sheet(f);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Relatorio");
            XLSX.writeFile(wb, Mesa_${dt}.xlsx);
        }

        atualizarTela();
    </script>
</body>
</html>
