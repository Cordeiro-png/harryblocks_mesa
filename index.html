!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA MESA - CONTROLE</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --red: #ff4444; --green: #00c851; --blue: #007bff; --admin: #00ff41; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f9; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; color: #333; }
        
        /* Menu Lateral Esquerdo */
        .sidebar { position: fixed; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        .btn-side { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s; }
        .btn-side:active { transform: scale(0.95); }

        h1 { margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }

        /* Progress Bar */
        .progress-box { width: 100%; max-width: 500px; background: var(--red); height: 30px; border-radius: 15px; border: 2px solid #222; overflow: hidden; margin: 20px 0; position: relative; }
        #bar { height: 100%; width: 0%; background: var(--green); transition: width 0.5s ease-in-out; }
        .perc-text { position: absolute; width: 100%; text-align: center; top: 5px; font-weight: bold; color: #000; text-shadow: 1px 1px 1px #fff; }

        /* Grid de Erros (Embaixo da Barra) */
        .error-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 500px; margin-bottom: 20px; }
        .error-card { background: white; padding: 10px; border-radius: 8px; text-align: center; font-size: 13px; border-bottom: 4px solid var(--red); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* Área de Votação */
        .vote-area { display: flex; gap: 30px; margin-top: 10px; }
        .vote-btn { background: white; padding: 20px; border-radius: 20px; text-align: center; cursor: pointer; width: 140px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s; border: 2px solid transparent; }
        .vote-btn:hover { border-color: var(--blue); transform: translateY(-5px); }
        .vote-btn img { width: 70px; height: 70px; object-fit: contain; margin-bottom: 10px; }
        .vote-btn p { margin: 0; font-weight: bold; font-size: 16px; }

        /* Modais */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 20px; z-index: 2000; box-shadow: 0 0 100px rgba(0,0,0,0.5); width: 320px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1500; }
        
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; color: white; font-size: 16px; margin-top: 20px; transition: 0.2s; }
        .btn-alt { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; background: #f8f9fa; font-weight: bold; font-size: 14px; text-align: left; }
        .btn-alt:hover { background: #e9ecef; border-color: var(--blue); }

        /* Canvas Planejamento */
        #planejamentoBox { position: relative; width: 300px; height: 300px; border: 2px solid #333; margin: 15px auto; background: white; border-radius: 5px; overflow: hidden; }
        #canvasDraw { position: absolute; top: 0; left: 0; cursor: crosshair; }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="btn-side" style="background:var(--green)" onclick="abrirModal('modalExcel')">📊 BAIXAR REGISTROS</button>
        <button class="btn-side" style="background:#6c757d" onclick="mostrarLogs()">🔍 VER REGISTROS</button>
    </div>

    <h1>SISTEMA DE MISSÕES</h1>

    <div style="display:flex; gap:15px;">
        <button onclick="desfazer()" style="background:#ffc107; padding:10px 20px; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">↩️ DESFAZER</button>
        <button onclick="abrirModal('modalPlanejamento')" style="background:#17a2b8; color:white; padding:10px 20px; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">📝 PLANEJAMENTO</button>
    </div>

    <div class="progress-box">
        <div id="bar"></div>
        <div class="perc-text">TAXA DE SUCESSO: <span id="txtPerc">0%</span></div>
    </div>

    <div class="error-grid">
        <div class="error-card">Mesa: <b id="cnt-mesa">0</b></div>
        <div class="error-card">Montagem: <b id="cnt-montagem">0</b></div>
        <div class="error-card">Programação: <b id="cnt-programacao">0</b></div>
        <div class="error-card">Variação: <b id="cnt-variacao">0</b></div>
        <div class="error-card">Soltagem: <b id="cnt-soltagem">0</b></div>
    </div>

    <div class="vote-area">
        <div class="vote-btn" onclick="fluxo(true)">
            <img src="like.png" alt="Sucesso">
            <p>CORRETO</p>
        </div>
        <div class="vote-btn" onclick="fluxo(false)">
            <img src="6323-dislikebs.png" alt="Erro">
            <p>ERRADO</p>
        </div>
    </div>

    <div id="m-overlay" class="overlay" onclick="fecharModais()"></div>

    <div id="modalEspec" class="modal">
        <h2 style="margin:0 0 10px 0; font-size: 18px;">Especificações da Soltagem</h2>
        
        <label>Selecione a Missão:</label>
        <select id="selMissao"></select>
        
        <label>Tempo Gasto (minutos):</label>
        <input type="number" id="inpTempo" placeholder="Ex: 15">
        
        <label>Data da Soltagem:</label>
        <input type="date" id="inpData">
        
        <div id="btnConfirmarArea"></div>
        <button onclick="fecharModais()" style="width:100%; background:none; border:none; color:red; margin-top:15px; cursor:pointer; font-weight:bold;">CANCELAR</button>
    </div>

    <div id="modalAlts" class="modal">
        <div style="text-align:center;">
            <img src="duvida.png" style="width:60px; margin-bottom:10px;">
            <h2 style="margin:0; font-size:18px;">Qual foi o motivo?</h2>
            <p style="font-size:13px; color:#666;">Tempo: <span id="tempoResumo">0</span> min</p>
        </div>
        <div style="margin-top:15px;">
            <button class="btn-alt" onclick="finalizar('Mesa')">1. Problema na Mesa</button>
            <button class="btn-alt" onclick="finalizar('Montagem')">2. Erro de Montagem</button>
            <button class="btn-alt" onclick="finalizar('Programação')">3. Erro de Programação</button>
            <button class="btn-alt" onclick="finalizar('Variação')">4. Variação de Material</button>
            <button class="btn-alt" onclick="finalizar('Soltagem')">5. Falha na Soltagem</button>
        </div>
    </div>

    <div id="modalPlanejamento" class="modal" style="width:340px;">
        <h2 style="margin:0;">Desenho / Mapa</h2>
        <div id="planejamentoBox">
            <img src="mesa.png" style="width:300px; height:300px; position:absolute; pointer-events:none;">
            <canvas id="canvasDraw" width="300" height="300"></canvas>
        </div>
        <button class="btn-action" style="background:#6c757d; margin-top:5px;" onclick="limparCanvas()">LIMPAR DESENHO</button>
        <button class="btn-action" style="background:var(--blue)" onclick="fecharModais()">FECHAR</button>
    </div>

    <div id="modalExcel" class="modal">
        <h2>Exportar Dados</h2>
        <label>Escolha o dia:</label>
        <input type="date" id="dataEx">
        <button class="btn-action" style="background:var(--green)" onclick="gerarExcel()">BAIXAR ARQUIVO .XLSX</button>
        <button onclick="fecharModais()" style="width:100%; border:none; background:none; color:red; margin-top:15px; cursor:pointer;">FECHAR</button>
    </div>

    <div id="modalAdmin" class="modal" style="background:#111; color:var(--admin); border:2px solid var(--admin);">
        <h2>PAINEL DE CONTROLE</h2>
        <label style="color:white">Título do Sistema:</label>
        <input type="text" id="cfgTitle" style="background:#222; color:var(--admin); border-color:var(--admin);">
        <button class="btn-action" style="background:red;" onclick="resetar()">APAGAR TODOS OS DADOS</button>
        <button onclick="fecharModais()" style="width:100%; color:white; background:none; border:none; margin-top:15px; cursor:pointer;">SAIR</button>
    </div>

    <audio id="sndOk" src="acerto.mp3"></audio>
    <audio id="sndErro" src="erro.mp3"></audio>

    <script>
        // --- BANCO DE DADOS LOCAL ---
        let storage = JSON.parse(localStorage.getItem('mesa_final_v8')) || {
            sim: 0, nao: 0, titulo: "MESA - CONTROLE DE MISSÕES",
            registros: [],
            erros: { Mesa:0, Montagem:0, Programação:0, Variação:0, Soltagem:0 }
        };

        let isSucessoPendente = null;
        let keys = "";

        // --- INICIALIZAÇÃO ---
        const select = document.getElementById('selMissao');
        for(let i=1; i<=15; i++){
            let m = "M" + (i < 10 ? "0"+i : i);
            select.innerHTML += <option value="${m}">${m}</option>;
        }

        function salvar() {
            localStorage.setItem('mesa_final_v8', JSON.stringify(storage));
            render();
        }

        function render() {
            document.querySelector('h1').innerText = storage.titulo;
            document.getElementById('cnt-mesa').innerText = storage.erros.Mesa;
            document.getElementById('cnt-montagem').innerText = storage.erros.Montagem;
            document.getElementById('cnt-programacao').innerText = storage.erros.Programação;
            document.getElementById('cnt-variacao').innerText = storage.erros.Variação;
            document.getElementById('cnt-soltagem').innerText = storage.erros.Soltagem;
            
            let total = storage.sim + storage.nao;
            let p = total === 0 ? 0 : Math.round((storage.sim / total) * 100);
            document.getElementById('bar').style.width = p + "%";
            document.getElementById('txtPerc').innerText = p + "%";
        }

        // --- FLUXO DE INTERAÇÃO ---
        function abrirModal(id) {
            document.getElementById('m-overlay').style.display = 'block';
            document.getElementById(id).style.display = 'block';
        }

        function fecharModais() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
            document.getElementById('m-overlay').style.display = 'none';
        }

        function fluxo(sucesso) {
            isSucessoPendente = sucesso;
            document.getElementById('inpData').valueAsDate = new Date(); // Data automática mas editável
            const areaBtn = document.getElementById('btnConfirmarArea');
            
            if(sucesso) {
                areaBtn.innerHTML = <button class="btn-action" style="background:var(--green)" onclick="finalizar('N/A')">SALVAR SUCESSO</button>;
            } else {
                areaBtn.innerHTML = <button class="btn-action" style="background:#fd7e14" onclick="proximoPassoErro()">DEFINIR MOTIVO DO ERRO</button>;
            }
            abrirModal('modalEspec');
        }

        function proximoPassoErro() {
            const t = document.getElementById('inpTempo').value;
            if(!t) { alert("Por favor, informe o tempo gasto na missão."); return; }
            document.getElementById('tempoResumo').innerText = t;
            fecharModais();
            abrirModal('modalAlts');
        }

        function finalizar(motivo) {
            const missao = document.getElementById('selMissao').value;
            const tempo = document.getElementById('inpTempo').value;
            const data = document.getElementById('inpData').value;

            if(!tempo || !data) { alert("Preencha o tempo e a data corretamente!"); return; }

            const reg = {
                data: data,
                missao: missao,
                tempo: tempo + " min",
                resultado: isSucessoPendente ? "SUCESSO" : "ERRO",
                motivo: motivo
            };

            storage.registros.push(reg);

            if(isSucessoPendente) {
                storage.sim++;
                try { document.getElementById('sndOk').play(); } catch(e){}
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            } else {
                storage.nao++;
                storage.erros[motivo]++;
                try { document.getElementById('sndErro').play(); } catch(e){}
            }

            document.getElementById('inpTempo').value = ""; // Limpa campo
            fecharModais();
            salvar();
        }

        // --- OUTRAS FUNÇÕES ---
        function desfazer() {
            if(storage.registros.length === 0) return;
            let ultimo = storage.registros.pop();
            if(ultimo.resultado === "SUCESSO") storage.sim--; 
            else { storage.nao--; storage.erros[ultimo.motivo]--; }
            salvar();
        }

        function mostrarLogs() {
            if(storage.registros.length === 0) { alert("Sem registros salvos."); return; }
            let texto = storage.registros.slice(-10).map(r => ${r.data} | ${r.missao}: ${r.resultado} (${r.motivo})).join('\n');
            alert("ÚLTIMOS 10 REGISTROS:\n\n" + texto);
        }

        function resetar() {
            if(confirm("Isso apagará TODOS os registros permanentemente. Confirma?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // --- SISTEMA DE DESENHO ---
        const canvas = document.getElementById('canvasDraw');
        const ctx = canvas.getContext('2d');
        let desenhando = false;

        canvas.addEventListener('mousedown', () => desenhando = true);
        canvas.addEventListener('mouseup', () => { desenhando = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', (e) => {
            if(!desenhando) return;
            ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = 'red';
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke(); ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        });
        function limparCanvas() { ctx.clearRect(0,0,300,300); }

        // --- GATILHO ADMIN ---
        document.addEventListener('keydown', (e) => {
            keys += e.key.toLowerCase();
            if(keys.endsWith("paineladm0102")) abrirModal('modalAdmin');
            if(keys.length > 20) keys = keys.substring(1);
        });

        document.getElementById('cfgTitle').addEventListener('input', (e) => {
            storage.titulo = e.target.value;
            salvar();
        });

        // --- EXCEL ---
        function gerarExcel() {
            const dt = document.getElementById('dataEx').value;
            const filtrados = storage.registros.filter(r => r.data === dt);
            if(filtrados.length === 0) { alert("Nenhum registro encontrado para esta data."); return; }
            const ws = XLSX.utils.json_to_sheet(filtrados);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Missões");
            XLSX.writeFile(wb, Relatorio_Mesa_${dt}.xlsx);
        }

        render();
    </script>
</body>
</html>
